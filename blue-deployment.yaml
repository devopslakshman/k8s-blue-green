apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-blue
  namrspace: roboshop
  labels:
    project: roboshop
    tier: frontend
    component: frontend
    version: blue
  annotations:
    kubernetes.io/change-cause: "Deploy nginx blue version using Roboshop blue ECR image"
spec:
  replicas: 4
  selector:
    matchLabels:
      project: roboshop
      tier: frontend
      component: frontend
      version: blue
  template:
    metadata:
      labels:
        project: roboshop
        tier: frontend
        component: frontend
        version: blue
    spec:
      containers:
      - name: nginx-blue
        image: 346882411601.dkr.ecr.us-east-1.amazonaws.com/roboshop/green:1.0
