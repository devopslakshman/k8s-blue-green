
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-green
  namespace: roboshop

  # Deployment labels
  labels:
    project: roboshop
    tier: frontend
    component: frontend
    version: green

  # Deployment annotation
  annotations:
    kubernetes.io/change-cause: "Deploy nginx green version using Roboshop green ECR image"

spec:
  replicas: 4

  selector:
    # ReplicaSet selects Pods using these labels
    matchLabels:
      project: roboshop
      tier: frontend
      component: frontend
      version: green

  # Pod definition
  template:
    metadata:
      labels:
        project: roboshop
        tier: frontend
        component: frontend
        version: green

    spec:
      containers:
        - name: nginx-green
          image: 346882411601.dkr.ecr.us-east-1.amazonaws.com/roboshop/green:1.0
