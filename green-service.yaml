apiVersion: v1
kind: Service
metadata:
  name: nginx-green
  namespace: roboshop
  labels:
    project: roboshop
    tier: frontend
    component: frontend
    version: green
spec:
  type: ClusterIP
  selector:
    project: roboshop
    tier: frontend
    component: frontend
    version: green
  ports:
    - name: http
      port: 30080
      targetPort: 80
      protocol: TCP
